<!DOCTYPE html>

<title>Valyuta konvertor</title>
<style>
*{box-sizing:border-box;margin:0;font-family:Roboto,Segoe UI,Arial,sans-serif}
body{background:#f5f5f5;min-height:100vh;display:flex;justify-content:center}
.screen{display:none;width:100%;max-width:420px;min-height:100vh;position:relative}
.screen.on{display:flex}
#welcome,#thanks,#made{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#e8e9fb,#f0f7f5);overflow:hidden;padding:24px}
.wall{position:absolute;inset:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;padding:10px;opacity:.35;overflow:hidden}
.wall img,.wall span{width:44px;height:30px;object-fit:cover;border-radius:4px}
.wall span{font-size:22px;text-align:center}
.box{position:relative;z-index:2}
h1{color:#1f2268;font-size:40px}
h2{color:#1f2268;font-size:26px;margin-bottom:6px}
p.sub{color:#777;margin:10px 0 24px}
.btn{background:#262a8a;color:#fff;border:0;border-radius:30px;padding:14px 36px;font-size:17px;cursor:pointer}
#app{flex-direction:column;padding:36px 24px;background:linear-gradient(#e8e9fb,#f5f5f5 40%)}
#app h2{text-align:center;margin-top:20px}
#app .sub{text-align:center;margin:8px 0 30px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 4px 14px #0002}
.lbl{color:#888;font-size:15px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.cur{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:#262a8a;font-size:20px;font-weight:700}
.cur img,.cur .em{width:48px;height:48px;border-radius:50%;object-fit:cover;font-size:30px;text-align:center;line-height:48px}
.val{flex:1;min-width:0;background:#eee;border:0;border-radius:10px;padding:14px;font-size:22px;font-weight:600;text-align:right;color:#333}
.mid{display:flex;align-items:center;margin:14px 0}
.mid hr{flex:1;border:0;border-top:1px solid #ddd}
.swap{width:48px;height:48px;border-radius:50%;border:0;background:#262a8a;color:#fff;font-size:22px;cursor:pointer}
.info{margin:26px 4px 0}
.info small{color:#999;font-size:16px}
.info b{display:block;margin-top:14px;font-size:18px}
.name{margin-top:10px;color:#555;font-size:14px}
.fin{margin:30px auto 0}
#picker{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
#picker.on{display:flex}
.sheet{background:#fff;width:100%;max-width:420px;height:82vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:16px}
.sheet input{border:1px solid #ccc;border-radius:12px;padding:12px;font-size:16px;margin:10px 0}
#list{overflow:auto;flex:1}
.it{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #eee;cursor:pointer}
.it:hover{background:#f0f0ff}
.it img,.it .em{width:40px;height:28px;object-fit:cover;border-radius:4px;font-size:22px}
.it div{flex:1}.it b{display:block;color:#222}.it small{color:#777}
.it i{font-style:normal;color:#262a8a;font-weight:700}

<body>

<div id="welcome" class="screen on">
    <div class="box">
    <h1>Xush kelibsiz!</h1>
    <p class="sub">Dunyodagi barcha davlatlar valyutalari bir joyda</p>
    <button class="btn" onclick="show('app')">Boshlash</button>
  </div>
</div>

<div id="app" class="screen">
  <h2>Valyuta konvertor</h2>
  <p class="sub">Istalgan davlat valyutasini tanlang va hisoblang</p>
  <div class="card">
    <div class="lbl">Summa</div>
    <div class="row">
      <button class="cur" id="fromBtn" onclick="openPicker('from')"></button>
      <input class="val" id="amt" type="number" value="1000" oninput="calc()">
    </div>
    <div class="mid"><hr><button class="swap" onclick="swap()">⇅</button><hr></div>
    <div class="lbl">Hisoblangan summa</div>
    <div class="row">
      <button class="cur" id="toBtn" onclick="openPicker('to')"></button>
      <input class="val" id="res" readonly>
    </div>
  </div>
  <div class="info">
    <small>Taxminiy kurs</small>
    <b id="rate"></b>
    <div class="name" id="names"></div>
  </div>
  <button class="btn fin" onclick="finish()">Tugatish</button>
</div>

<div id="thanks" class="screen">
  <div class="wall" id="wall2"></div>
  <div class="box"><h1>Rahmat!</h1><p class="sub">Foydalanganingiz uchun katta rahmat 💙</p></div>
</div>

<div id="made" class="screen">
  <div class="box"><div class="zebo"><svg class="bow" viewBox="0 0 64 44" width="52" height="36" aria-hidden="true"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb6d3"/><stop offset="1" stop-color="#f06a9f"/></linearGradient></defs><path d="M32 22C22 6 6 2 3 10c-3 9 6 24 29 12z" fill="url(#bg)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M32 22c10-16 26-20 29-12 3 9-6 24-29 12z" fill="url(#bg)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M32 22c-9 4-18 12-20 20 7 1 15-6 20-20zM32 22c9 4 18 12 20 20-7 1-15-6-20-20z" fill="#f06a9f" stroke="#fff" stroke-width="2" stroke-linejoin="round" transform="translate(0 -2) scale(1 .85) translate(0 4)"/><path d="M12 10c4-2 9 0 13 6M52 10c-4-2-9 0-13 6" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="32" cy="22" rx="6" ry="6.5" fill="#e0558f" stroke="#fff" stroke-width="2"/><circle cx="30" cy="20" r="1.8" fill="#fff" fill-opacity=".8"/></svg><span>Made in Zebo</span></div></div>
</div>

<div id="picker" onclick="if(event.target===this)closePicker()">
  <div class="sheet">
    <h2 style="font-size:20px">Davlat yoki valyutani tanlang</h2>
    <input id="q" placeholder="Davlat, valyuta yoki kod yozing (masalan: Yaponiya, yen, JPY)" oninput="render()">
    <div id="list"></div>
  </div>
</div>

const flag=(cc,c='')=>`<img class="${c}" src="${FL[cc]||''}" alt="">`;
let from=D.find(x=>x.cc=='SV'),to=D.find(x=>x.cc=='UZ'),side='from';

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on')}
const wallHTML=D.map(x=>flag(x.cc)).join('');
wall2.innerHTML=wallHTML;

function btn(el,x){el.innerHTML=flag(x.cc)+x.c+' ▾'}
function calc(){
  const a=+amt.value||0,k=to.r/from.r;
  res.value=(a*k).toLocaleString('en',{maximumFractionDigits:2,minimumFractionDigits:2});
  btn(fromBtn,from);btn(toBtn,to);
  rate.textContent=`1 ${from.c} = ${k.toLocaleString('en',{maximumSignificantDigits:5})} ${to.c}`;
  names.textContent=`${from.n} (${N[from.c]||from.c}) → ${to.n} (${N[to.c]||to.c})`;
}
function swap(){[from,to]=[to,from];calc()}
function openPicker(s){side=s;q.value='';render();picker.classList.add('on');q.focus()}
function closePicker(){picker.classList.remove('on')}
function render(){
  const t=q.value.trim().toLowerCase();
  list.innerHTML=D.filter(x=>!t||(x.n+' '+x.c+' '+(N[x.c]||'')+' '+x.cc).toLowerCase().includes(t))
   .map(x=>`<div class="it" onclick="pick('${x.cc}')">${flag(x.cc)}<div><b>${x.n}</b><small>${N[x.c]||x.c}</small></div><i>${x.c}</i></div>`).join('')||'<p style="padding:20px;color:#888">Topilmadi</p>';
}
function pick(cc){const x=D.find(d=>d.cc==cc);side=='from'?from=x:to=x;closePicker();calc()}
function finish(){show('thanks');setTimeout(()=>show('made'),2800)}
calc();
</script>
